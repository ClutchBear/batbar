# batbar 打包与依赖声明（PEP 621，uv 友好）。
#
# 依赖按角色切组：
#   - 基础：无第三方（纯逻辑层在任意 Python 3.11+ 可跑）
#   - agent（Windows 运行时）：hidapi（cython-hidapi，自带预编译 wheel）+ pystray + Pillow
#
# 在 Windows 跑 agent：uv sync --extra agent

[project]
name = "batbar"
version = "0.1.4"
description = "常驻 Windows 系统托盘的多设备电量指示器（鼠标 / 耳机 / 机械键盘）"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "ClutchBear" }]
dependencies = []

[project.optional-dependencies]
agent = [
    "hidapi>=0.15.0; sys_platform == 'win32'",
    "pystray>=0.19.5; sys_platform == 'win32'",
    "Pillow>=10",
]
dev = ["pytest>=8", "pytest-timeout"]

[project.scripts]
batbar-agent = "batbar.agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/batbar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
